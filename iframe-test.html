<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест iframe — камера на iOS</title>
<style>
  body{margin:0;font-family:-apple-system,sans-serif;background:#f4ede7}
  .note{padding:12px 16px;background:#622735;color:#fff;font-size:13px}
  iframe{width:100%;height:calc(100vh - 40px);border:0;display:block}
</style>
</head>
<body>
  <div class="note">Тест: чи працює камера всередині iframe на iOS Safari — так само, як буде вбудовано в Weblium</div>
  <iframe
    src="https://tetianapalapa.github.io/dipsy-ritual/"
    allow="camera; fullscreen"
    allowfullscreen>
  </iframe>
</body>
</html>
